name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts가 요구. 테스트는 jest globalSetup이 임시 DB로 덮어씀
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/public/admin-spa/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix src/public/admin-spa ci --ignore-scripts

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (unit + integration)
        run: npm test

      - name: Build (server + admin-spa)
        run: npm run build
