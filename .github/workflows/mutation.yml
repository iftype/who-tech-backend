name: Mutation Test

# 뮤테이션 테스트는 느려서(약 50분) PR마다 돌리지 않고 매주 + 수동 실행한다. 점수 70% 미만이면 실패
on:
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Stryker (backend)
        run: npm run test:mutation

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-backend
          path: reports/mutation
          retention-days: 14
