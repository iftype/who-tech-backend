name: Deploy to Server

# main의 CI가 성공한 커밋만 배포한다. 비상시 수동 실행(workflow_dispatch) 가능
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Trigger server deploy
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "Deploying $TARGET_SHA"
          curl -sf -X POST https://iftype.site/admin/deploy \
            -H "Authorization: Bearer $ADMIN_SECRET"

      # 서버의 deploy-run.sh가 실패 시 이전 커밋으로 롤백하므로, 새 SHA가 보이지 않으면 실패로 처리한다
      # 서버는 그 시점의 main 최신을 받는다. 머지가 겹치면 TARGET보다 새 커밋이 배포되므로
      # /health 커밋이 TARGET이거나 TARGET을 포함하는(앞선) 커밋이면 성공으로 본다. 뒤거나 갈라졌으면(롤백) 계속 기다린다 (#239)
      - name: Verify deployed commit via /health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            body="$(curl -fsS --max-time 10 https://iftype.site/health || true)"
            deployed="$(echo "$body" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')"
            if [ "$deployed" = "$TARGET_SHA" ]; then
              echo "Deployed: $body"
              exit 0
            fi
            if [ -n "$deployed" ]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$deployed" --jq .status 2>/dev/null || true)"
              if [ "$status" = "ahead" ]; then
                echo "Deployed a newer commit that includes $TARGET_SHA: $body"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::10분 안에 /health가 $TARGET_SHA 를 보고하지 않았습니다 (배포 실패 또는 롤백). 마지막 응답: $body"
          exit 1
