name: Deploy to Server

# main의 CI가 성공한 커밋만 배포한다. 비상시 수동 실행(workflow_dispatch) 가능
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Trigger server deploy
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "Deploying $TARGET_SHA"
          curl -sf -X POST https://iftype.site/admin/deploy \
            -H "Authorization: Bearer $ADMIN_SECRET"

      # 서버의 deploy-run.sh가 실패 시 이전 커밋으로 롤백하므로, 새 SHA가 보이지 않으면 실패로 처리한다
      - name: Verify deployed commit via /health
        run: |
          for i in $(seq 1 60); do
            body="$(curl -fsS --max-time 10 https://iftype.site/health || true)"
            if echo "$body" | grep -q "\"commit\":\"$TARGET_SHA\""; then
              echo "Deployed: $body"
              exit 0
            fi
            sleep 10
          done
          echo "::error::10분 안에 /health가 $TARGET_SHA 를 보고하지 않았습니다 (배포 실패 또는 롤백). 마지막 응답: $body"
          exit 1
